<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submit Report — ScamAlert</title><script>try{document.documentElement.dataset.theme=localStorage.getItem("scamalert-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="/css/style.css"></head>
<body><header class="top"><div class="wrap"><a class="logo" href="/">ScamAlert</a>
<nav class="main"><a href="/reports.html">Reports</a><a href="/search.html">Search</a><a href="/help.html">Help</a></nav>
<div class="userbox"><a class="btn" href="/report-new.html">Submit Report</a><span id="user-menu"></span></div></div></header>
<main class="wrap"><h1>Report a website</h1><div id="anon-banner"></div><div id="form-error" class="error" style="display:none"></div>
<form id="report-form">
<label>Website URL<input name="url" type="url" required placeholder="https://suspicious-site.example"></label>
<label>Category<select name="category_slug" required>
<option value="">Select…</option><option value="phishing">Phishing</option><option value="investment-scam">Investment scam</option>
<option value="fake-ecommerce">Fake e-commerce</option><option value="impersonation">Impersonation</option>
<option value="payment-fraud">Payment fraud</option><option value="fake-job-scam">Fake job scam</option>
<option value="malware">Malware</option><option value="product-never-delivered">Product never delivered</option>
<option value="suspicious-behaviour">Suspicious behaviour</option><option value="other">Other</option>
</select></label>
<label>Title (max 200)<input name="title" type="text" required maxlength="200"></label>
<label>Description<textarea name="description" required rows="6"></textarea></label>
<label>Target brand (optional)<input name="target_brand" type="text"></label>
<label>Amount lost (optional)<input name="amount_lost" type="number" min="0" step="0.01"></label>
<label>Incident date<input name="incident_date" type="date"></label>
<input name="country_code" type="hidden" value="IN">
<label id="anon-row" style="display:none"><input name="is_anonymous" type="checkbox" style="width:auto"> Submit anonymously</label>
<label>Evidence (optional, max 10MB each)<input id="files" type="file" multiple accept="image/*,.pdf,.txt,.html,video/mp4,video/webm,audio/mpeg,audio/wav"></label>
<div id="file-list" class="small"></div>
<p><button class="btn" id="submit-btn" type="submit">Submit Report</button></p>
</form></main>
<footer class="bot"><div class="wrap"><a href="tel:+911930">1930 Helpline</a><a href="https://cybercrime.gov.in" target="_blank" rel="noopener">NCRP</a><a href="mailto:incident@cert-in.org.in">CERT-In</a><p>ScamAlert — Community-driven fraud protection for India</p></div></footer>
<script src="/js/app.js"></script><script src="/js/auth.js"></script><script src="/js/theme.js"></script><script src="/js/report-new.js"></script>
</body></html>
